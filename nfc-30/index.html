<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Рассылка NFC</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f4f2;--card:#fff;--ink:#16161a;--mute:#6b6b72;--wa:#1f9d55;--done:#d9d9d6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Onest,system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:24px;margin:0 0 6px}
p{margin:0 0 14px;color:var(--mute)}
.bar{position:sticky;top:0;background:var(--bg);padding:10px 0;font-weight:600;z-index:1}
.g{margin:22px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.c{background:var(--card);border-radius:14px;padding:12px 14px;margin:0 0 8px;display:flex;align-items:center;gap:10px}
.c.sent{opacity:.45}
.n{flex:1;min-width:0}
.n b{display:block;overflow-wrap:anywhere}
.n small{color:var(--mute)}
a.w{min-height:44px;min-width:44px;padding:0 16px;display:inline-flex;align-items:center;border-radius:10px;background:var(--wa);color:#fff;text-decoration:none;font-weight:600}
.c.sent a.w{background:var(--done);color:var(--ink)}
a:focus-visible,button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button{min-height:44px;margin-top:20px;padding:0 16px;border:1px solid var(--mute);border-radius:10px;background:none;font:inherit}
details{background:var(--card);border-radius:14px;padding:12px 14px}
</style>
</head>
<body>
<main>
<h1>NFC-таблички: 30 фирм</h1>
<p>Жми «Написать», откроется WhatsApp с готовым текстом, нажми отправить. Карточка станет серой. Пиши не больше 15 в день и делай паузу 1–2 минуты между сообщениями, иначе WhatsApp может заблокировать номер.</p>
<details><summary>Текст сообщения</summary><p id="t" style="margin:8px 0 0"></p></details>
<div class="bar" id="cnt"></div>
<div id="list"></div>
<button id="reset" type="button">Сбросить отметки</button>
</main>
<script>
const T='Здравствуйте, я делаю NFC-таблички для отзывов в 2GIS: клиент подносит телефон к табличке и сразу пишет отзыв о вас. Одна 1 000 сом, две 1 500. Интересно?';
const D=[
['Маникюр и брови',[['Beautyroomkg','996558441771'],['Роза Style','996700864933'],['Beauty & Art','996555346212'],['S.cut','996704203100'],['Expert','996502100106']]],
['Косметологи и массаж',[['КосМед','996550211882'],['Mirey Clinic','996709304056'],['Clever Med','996700888888'],['Империя Массажа','996709171530']]],
['Барбершопы',[['Красивый город','996708600602'],["Ambassador men's club",'996880820777']]],
['Автосервисы',[['Столетие','996702222245'],['Mercur','996770811444'],['KYB','996555155737']]],
['Автомойки',[['А1','996705010101'],['Auto Prado','996706466769'],['Кондор','996502757888']]],
['Шиномонтаж',[['Колесо 312','996507690000'],['G14','996707833733'],['Акжол','996509150160'],['Эрик Доктор','996708040030']]],
['Ветклиники',[['Пирамида','996990288882'],['ЗооМир','996555959703']]],
['Химчистки',[['Белая Орхидея','996555610394'],['Cristals','996508802008'],['SneakNFresh black','996555664477']]],
['Фотостудии',[['Up Studio','996776299184'],['Nerse Concept','996997999419']]],
['Ремонт телефонов',[['ТехноКом','996705891054']]],
['Ателье',[['Сезон','996550440310']]]
];
let S={};try{S=JSON.parse(localStorage.getItem('nfc30')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('nfc30',JSON.stringify(S))}catch(e){}};
document.getElementById('t').textContent=T;
const L=document.getElementById('list');
function draw(){
  L.innerHTML='';let n=0,all=0;
  for(const [g,items] of D){
    const h=document.createElement('div');h.className='g';h.textContent=g;L.append(h);
    for(const [name,ph] of items){
      all++;if(S[ph])n++;
      const c=document.createElement('div');c.className='c'+(S[ph]?' sent':'');
      const i=document.createElement('div');i.className='n';
      i.innerHTML='<b></b><small>+'+ph.replace(/(\d{3})(\d{3})(\d{3})(\d{3})/,'$1 $2 $3 $4')+'</small>';
      i.querySelector('b').textContent=name;
      const a=document.createElement('a');a.className='w';
      a.href='https://wa.me/'+ph+'?text='+encodeURIComponent(T);a.target='_blank';a.rel='noopener';
      a.textContent=S[ph]?'Отправлено':'Написать';
      a.onclick=()=>{S[ph]=1;save();setTimeout(draw,300)};
      c.append(i,a);L.append(c);
    }
  }
  document.getElementById('cnt').textContent='Отправлено: '+n+' из '+all;
}
document.getElementById('reset').onclick=()=>{if(confirm('Сбросить все отметки?')){S={};save();draw()}};
draw();
</script>
</body>
</html>
